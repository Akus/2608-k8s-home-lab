# node-exporter is cluster infrastructure, not part of the lakehouse — it has its own
# Application so the lakehouse can be deleted and re-created without taking monitoring with it.
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: node-exporter
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/Akus/2608-k8s-home-lab.git
    targetRevision: main
    path: clusters/home-lab/node-exporter
  destination:
    server: https://kubernetes.default.svc
    namespace: monitoring
  syncPolicy:
    automated:
      prune: true
      selfHeal: true
