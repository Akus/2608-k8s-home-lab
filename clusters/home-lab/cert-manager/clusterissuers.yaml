# Let's Encrypt via DNS-01 on the akos-demo.com Route53 zone (see HTTPS-CERTS.md, Option B).
# cert-manager writes _acme-challenge TXT records with the IAM key in the
# cert-manager/route53-credentials Secret (created by hand, never committed). No hostedZoneID:
# cert-manager finds the zone via route53:ListHostedZonesByName, so nothing account-specific
# lives here. Issue against staging first; prod has tight rate limits.
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-staging
spec:
  acme:
    server: https://acme-staging-v02.api.letsencrypt.org/directory
    email: akosbodor@gmail.com
    privateKeySecretRef:
      name: letsencrypt-staging-key
    solvers:
      - dns01:
          route53:
            region: us-east-1 # Route53 is global; the SDK still wants a region
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: akosbodor@gmail.com
    privateKeySecretRef:
      name: letsencrypt-prod-key
    solvers:
      - dns01:
          route53:
            region: us-east-1
            accessKeyIDSecretRef:
              name: route53-credentials
              key: access-key-id
            secretAccessKeySecretRef:
              name: route53-credentials
              key: secret-access-key
