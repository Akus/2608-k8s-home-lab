# Iceberg REST catalog — the thing that knows which files make up a table.
#
# Why REST and not AWS Glue: Glue is AWS-only and this lab's other half is AKS, so a
# vendor-neutral catalog is what actually transfers. Spark talks to it over plain HTTP.
#
# Backing store is SQLite on a PVC. The image already ships JDBC+SQLite as its default
# (CATALOG_CATALOG__IMPL / CATALOG_URI below just move the file off /tmp onto the volume so it
# survives a restart), which keeps the image stock — no Postgres, no JDBC driver to add, one
# less pod. The tradeoff is a single writer, which is exactly what this lab has. Point
# CATALOG_URI at Postgres if that ever stops being true.
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: iceberg-rest-data
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: local-path
  resources:
    requests:
      storage: 1Gi
---
apiVersion: v1
kind: Service
metadata:
  name: iceberg-rest
spec:
  selector:
    app.kubernetes.io/name: iceberg-rest
  ports:
    - { name: rest, port: 8181, targetPort: 8181 }
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: iceberg-rest
spec:
  replicas: 1
  strategy:
    type: Recreate # RWO volume + SQLite: never two pods on it at once
  selector:
    matchLabels:
      app.kubernetes.io/name: iceberg-rest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: iceberg-rest
    spec:
      securityContext:
        fsGroup: 1000 # so the PVC is writable whatever UID the image picks
      containers:
        - name: iceberg-rest
          image: apache/iceberg-rest-fixture:1.10.1
          env:
            - { name: CATALOG_CATALOG__IMPL, value: org.apache.iceberg.jdbc.JdbcCatalog }
            - { name: CATALOG_URI, value: "jdbc:sqlite:/data/iceberg_catalog.db" }
            - { name: CATALOG_JDBC_USER, value: "user" }
            - { name: CATALOG_JDBC_PASSWORD, value: "password" }
            - { name: CATALOG_WAREHOUSE, value: "s3://lakehouse/warehouse" }
            - { name: CATALOG_IO__IMPL, value: org.apache.iceberg.aws.s3.S3FileIO }
            - { name: CATALOG_S3_ENDPOINT, value: "http://garage:3900" }
            - { name: CATALOG_S3_PATH__STYLE__ACCESS, value: "true" }
            - { name: AWS_REGION, value: garage }
            # AWS SDK v2 >= 2.30 adds flexible checksums (x-amz-checksum-*, aws-chunked
            # trailers) to every PUT by default. Garage rejects those with
            # "Invalid payload signature". Both knobs are SDK-level, not Iceberg-level, so
            # they are the fix for any S3-compatible store that is not actually AWS.
            - { name: AWS_REQUEST_CHECKSUM_CALCULATION, value: when_required }
            - { name: AWS_RESPONSE_CHECKSUM_VALIDATION, value: when_required }
            - name: AWS_ACCESS_KEY_ID
              valueFrom:
                secretKeyRef: { name: lakehouse-s3-credentials, key: access-key-id }
            - name: AWS_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef: { name: lakehouse-s3-credentials, key: secret-access-key }
          ports:
            - { name: rest, containerPort: 8181 }
          volumeMounts:
            - { name: data, mountPath: /data }
          resources:
            requests: { cpu: 50m, memory: 256Mi }
            limits:   { cpu: 1, memory: 512Mi }
          readinessProbe:
            httpGet: { path: /v1/config, port: 8181 }
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            httpGet: { path: /v1/config, port: 8181 }
            initialDelaySeconds: 60
            periodSeconds: 30
      volumes:
        - name: data
          persistentVolumeClaim: { claimName: iceberg-rest-data }
